name: Render real motion GIF
on:
  push:
    branches: [main]
    paths:
      - 'scripts/render-motion-frames.mjs'
      - 'preview/core/**'
      - '.github/workflows/render-motion-media.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Render deterministic scenes
        run: node scripts/render-motion-frames.mjs
      - name: Encode animated preview
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -hide_banner -loglevel error -y -framerate 12 \
            -i artifacts/motion-frames/%03d.ppm \
            -vf 'fps=12,scale=840:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=64:stats_mode=diff[p];[s1][p]paletteuse=dither=bayer:bayer_scale=5' \
            -loop 0 assets/motion-preview.gif
          file assets/motion-preview.gif
          test "$(stat -c%s assets/motion-preview.gif)" -gt 10000
      - name: Commit generated GIF
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/motion-preview.gif
          if git diff --cached --quiet; then
            echo "No media changes"
            exit 0
          fi
          git commit -m "docs: update real procedural motion preview GIF [skip ci]"
          git push origin HEAD:main
