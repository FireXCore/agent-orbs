name: Publish GitHub Package v0.1.0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-github-package.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure Node and GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@firexcore'
      - name: Install dependencies
        run: npm install
      - name: Verify package and demos
        run: npm run check
      - name: Publish v0.1.0 to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          if npm view @firexcore/agent-orbs@0.1.0 version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "Package version 0.1.0 already exists"
          else
            npm publish --registry=https://npm.pkg.github.com
          fi
